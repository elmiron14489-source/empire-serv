<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empire XP — Web версия</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1a2a3a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .game-container {
            background: #2c3e50;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #1e2f3f;
            border-radius: 12px;
            cursor: pointer;
            display: block;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px #0f1a24;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            color: #ecf0f1;
            font-size: 16px;
            padding: 10px 5px;
            background: #1a2a3a;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .info-panel div {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .btn {
            background: #3498db;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .btn:hover {
            background: #2980b9;
            transform: scale(1.02);
        }
        .btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            background: #2c3e50;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 500;
            min-width: 200px;
            text-align: center;
        }
        .army-badge {
            background: #e67e22;
            padding: 2px 10px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .info-panel { flex-direction: column; align-items: stretch; }
            .status { min-width: unset; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="mapCanvas" width="800" height="500"></canvas>
    <div class="info-panel">
        <div>
            <span class="player-tag" id="currentPlayerTag" style="background:#e74c3c;">Игрок 1</span>
            <span class="army-badge" id="armyCount">💂 0</span>
        </div>
        <div class="status" id="statusMessage">Нажмите на регион</div>
        <div>
            <button class="btn" id="endTurnBtn">⏭ Завершить ход</button>
            <button class="btn" id="resetBtn" style="background:#e67e22;">🔄 Новая игра</button>
        </div>
    </div>
</div>
<script>
    // ============================================================
    //  ДАННЫЕ КАРТЫ (8 регионов с координатами и соседями)
    // ============================================================
    const territoriesData = [
        { id: 0, name: 'Аляска', x: 120, y: 100, neighbors: [1, 3] },
        { id: 1, name: 'Северная Америка', x: 250, y: 140, neighbors: [0, 2, 3] },
        { id: 2, name: 'Гренландия', x: 380, y: 80, neighbors: [1, 4] },
        { id: 3, name: 'Южная Америка', x: 280, y: 260, neighbors: [0, 1, 5] },
        { id: 4, name: 'Европа', x: 460, y: 160, neighbors: [2, 5, 6] },
        { id: 5, name: 'Африка', x: 460, y: 280, neighbors: [3, 4, 6, 7] },
        { id: 6, name: 'Азия', x: 600, y: 160, neighbors: [4, 5, 7] },
        { id: 7, name: 'Австралия', x: 650, y: 340, neighbors: [5, 6] }
    ];

    // ============================================================
    //  СОСТОЯНИЕ ИГРЫ
    // ============================================================
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    let game = {};

    function initGame() {
        game = {
            players: [
                { id: 0, name: 'Игрок 1', color: '#e74c3c', territories: [], armiesTotal: 0 },
                { id: 1, name: 'Компьютер', color: '#2ecc71', territories: [], armiesTotal: 0 }
            ],
            territories: territoriesData.map(t => ({
                ...t,
                ownerId: null,
                armies: 0
            })),
            currentPlayer: 0,
            phase: 'place_initial',   // 'place_initial', 'reinforce', 'attack', 'move'
            selectedFrom: null,       // id территории (источник атаки или перемещения)
            selectedTo: null,
            turnNumber: 0,
            initialPlacementDone: false,
            // для ИИ
            aiTimeout: null,
            gameOver: false
        };
        // Начальная расстановка: каждый игрок получает по 20 войск
        game.players.forEach(p => p.armiesTotal = 20);
        // Все территории свободны
        game.territories.forEach(t => { t.ownerId = null; t.armies = 0; });
        game.currentPlayer = 0;
        game.phase = 'place_initial';
        game.initialPlacementDone = false;
        game.gameOver = false;
        if (game.aiTimeout) clearTimeout(game.aiTimeout);
        updateUI();
        drawMap();
        setStatus('Начальная расстановка: кликните по свободной территории, чтобы поставить 1 войско');
    }

    // ============================================================
    //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function getTerritory(id) { return game.territories.find(t => t.id === id); }

    function getPlayer(id) { return game.players.find(p => p.id === id); }

    function getPlayerTerritories(playerId) {
        return game.territories.filter(t => t.ownerId === playerId);
    }

    function getEnemyTerritories(playerId) {
        return game.territories.filter(t => t.ownerId !== null && t.ownerId !== playerId);
    }

    function getNeighborTerritories(terrId) {
        const t = getTerritory(terrId);
        return t.neighbors.map(id => getTerritory(id)).filter(Boolean);
    }

    function getControlledNeighbors(terrId, playerId) {
        return getNeighborTerritories(terrId).filter(n => n.ownerId === playerId);
    }

    function getEnemyNeighbors(terrId, playerId) {
        return getNeighborTerritories(terrId).filter(n => n.ownerId !== null && n.ownerId !== playerId);
    }

    function countTerritories(playerId) {
        return getPlayerTerritories(playerId).length;
    }

    // ============================================================
    //  ЛОГИКА ИГРЫ
    // ============================================================

    // Подкрепление (в начале хода)
    function calculateReinforcements(playerId) {
        const count = countTerritories(playerId);
        // Минимум 3, плюс количество территорий / 3 (округляем вниз)
        let bonus = Math.max(3, Math.floor(count / 3));
        // Бонус за контроль целых континентов (упрощённо — нет)
        return bonus;
    }

    // Бросок кубиков
    function rollDice(num) {
        return Array.from({ length: num }, () => Math.floor(Math.random() * 6) + 1);
    }

    // Битва: атакующий (attackerId) атакует защитника (defenderId) из источника (sourceId)
    function resolveBattle(sourceId, targetId) {
        const source = getTerritory(sourceId);
        const target = getTerritory(targetId);
        if (source.ownerId === target.ownerId) return false;
        if (source.armies < 2) { setStatus('В источнике должно быть минимум 2 войска для атаки'); return false; }

        const attacker = getPlayer(source.ownerId);
        const defender = getPlayer(target.ownerId);

        // Количество кубиков: атакующий до 3 (но не больше армий-1), защитник до 2 (но не больше армий)
        let attackDice = Math.min(3, source.armies - 1);
        let defendDice = Math.min(2, target.armies);

        let aRolls = rollDice(attackDice).sort((a,b) => b - a);
        let dRolls = rollDice(defendDice).sort((a,b) => b - a);

        let aLoss = 0, dLoss = 0;
        for (let i = 0; i < Math.min(aRolls.length, dRolls.length); i++) {
            if (aRolls[i] > dRolls[i]) {
                dLoss++; // защитник теряет
            } else {
                aLoss++; // атакующий теряет (ничья в пользу защитника)
            }
        }

        // Применяем потери
        source.armies -= aLoss;
        target.armies -= dLoss;

        // Если защитник потерял все войска, территория переходит атакующему
        let conquered = false;
        if (target.armies <= 0) {
            // Переход: атакующий перемещает минимум 1 войско на захваченную территорию
            // Он должен оставить хотя бы 1 в источнике
            if (source.armies >= 1) {
                // Перемещаем 1 войско (можно больше, но для простоты 1)
                source.armies -= 1;
                target.armies = 1;
                target.ownerId = source.ownerId;
                conquered = true;
            } else {
                // Недостаточно войск для оккупации (быть не может, т.к. атаковали с >=2)
                target.armies = 1; // восстанавливаем, чтобы не сломать
            }
        }

        // Если источник потерял все войска (редко), то он становится нейтральным? Нет, по правилам Risk, если атакующий потерял все, он просто проиграл битву, но территория остаётся его с 0? В классике нельзя атаковать с 1, мы проверяли.
        // Дополнительно: если источник стал 0, это возможно только если атакующий потерял все, но мы не разрешаем атаку с 1, значит минимум 2, после потерь может стать 0? Если атаковал с 2 и потерял 2 - тогда источник остаётся с 0, это допустимо? По правилам, если атака не удалась, то войска остаются на месте, но если они все погибли, то территория становится незанятой? В стандарте Risk, если атакующий теряет все войска, то он теряет территорию? Нет, территория остаётся его, но с 0 войсками? Обычно минимальное количество - 1, поэтому атакуют с 2+. Мы упростим: если источник стал 0, то мы ставим 1, чтобы не было пустых территорий.
        if (source.armies < 1) source.armies = 1;

        // Обновляем количество армий игроков (для отображения)
        updatePlayerArmies();

        // Возвращаем результат
        return { conquered, aLoss, dLoss };
    }

    function updatePlayerArmies() {
        game.players.forEach(p => {
            p.armiesTotal = game.territories.filter(t => t.ownerId === p.id).reduce((sum, t) => sum + t.armies, 0);
        });
    }

    // Проверка на победу
    function checkWin() {
        const totalTerritories = game.territories.length;
        for (let p of game.players) {
            if (countTerritories(p.id) === totalTerritories) {
                game.gameOver = true;
                return p;
            }
        }
        return null;
    }

    // ============================================================
    //  ХОД ИГРОКА (интерфейс)
    // ============================================================
    function startTurn(playerId) {
        if (game.gameOver) return;
        game.currentPlayer = playerId;
        const player = getPlayer(playerId);

        // Если это компьютер — запускаем AI
        if (player.id === 1) {
            setStatus('Ход компьютера...');
            disableButtons(true);
            // Задержка для имитации мышления
            if (game.aiTimeout) clearTimeout(game.aiTimeout);
            game.aiTimeout = setTimeout(() => {
                aiTurn();
            }, 600);
            return;
        }

        // Человек
        disableButtons(false);
        // Фаза подкрепления
        const bonus = calculateReinforcements(playerId);
        player.armiesTotal += bonus;
        updatePlayerArmies();
        game.phase = 'reinforce';
        setStatus(`Подкрепление: +${bonus} войск. Кликните по своей территории, чтобы разместить (у вас ${player.armiesTotal} свободных).`);
        // Сброс выбора
        game.selectedFrom = null;
        game.selectedTo = null;
        updateUI();
        drawMap();
    }

    // Обработка клика по территории
    function handleTerritoryClick(terrId) {
        if (game.gameOver) return;
        const terr = getTerritory(terrId);
        const player = getPlayer(game.currentPlayer);

        // ---- Начальная расстановка ----
        if (game.phase === 'place_initial') {
            if (terr.ownerId !== null) {
                setStatus('Эта территория уже занята, выберите свободную.');
                return;
            }
            // Ставим 1 войско текущего игрока
            terr.ownerId = game.currentPlayer;
            terr.armies = 1;
            player.armiesTotal -= 1;
            // Проверяем, все ли территории заняты?
            const free = game.territories.filter(t => t.ownerId === null);
            if (free.length === 0) {
                // Расстановка завершена
                game.initialPlacementDone = true;
                // Передаём ход первому игроку
                game.currentPlayer = 0;
                startTurn(0);
            } else {
                // Следующий игрок
                game.currentPlayer = (game.currentPlayer + 1) % game.players.length;
                // Если следующий игрок компьютер, он тоже должен расставить по одной (автоматически)
                // Упростим: дадим компьютеру автоматически занять свободную территорию
                if (game.currentPlayer === 1) {
                    // Авто-расстановка для компьютера
                    const free2 = game.territories.filter(t => t.ownerId === null);
                    if (free2.length > 0) {
                        const rand = free2[Math.floor(Math.random() * free2.length)];
                        rand.ownerId = 1;
                        rand.armies = 1;
                        getPlayer(1).armiesTotal -= 1;
                        // Проверяем, не закончилась ли расстановка
                        const free3 = game.territories.filter(t => t.ownerId === null);
                        if (free3.length === 0) {
                            game.initialPlacementDone = true;
                            game.currentPlayer = 0;
                            startTurn(0);
                        } else {
                            // Снова ход человека
                            game.currentPlayer = 0;
                            setStatus('Ваша очередь расстановки. Кликните по свободной территории.');
                        }
                    }
                } else {
                    setStatus('Расстановка: кликните по свободной территории.');
                }
                updateUI();
                drawMap();
            }
            return;
        }

        // ---- Основные фазы ----
        // Проверяем, что территория принадлежит текущему игроку для некоторых действий
        if (game.phase === 'reinforce') {
            // Размещение подкрепления
            if (terr.ownerId !== game.currentPlayer) {
                setStatus('Вы можете размещать войска только на своих территориях.');
                return;
            }
            if (player.armiesTotal <= 0) {
                setStatus('У вас нет свободных войск для размещения.');
                return;
            }
            // Размещаем 1 войско
            terr.armies += 1;
            player.armiesTotal -= 1;
            updatePlayerArmies();
            // Если войска кончились, переходим в фазу атаки
            if (player.armiesTotal === 0) {
                game.phase = 'attack';
                setStatus('Фаза атаки: выберите свою территорию с >=2 войсками, затем вражескую соседнюю.');
                game.selectedFrom = null;
            } else {
                setStatus(`Размещено. Осталось ${player.armiesTotal} войск. Кликните по своей территории.`);
            }
            updateUI();
            drawMap();
            return;
        }

        if (game.phase === 'attack') {
            // Если ещё не выбран источник
            if (game.selectedFrom === null) {
                // Выбираем источник: должна быть своя территория с >=2 войсками
                if (terr.ownerId !== game.currentPlayer) {
                    setStatus('Выберите свою территорию для атаки (должно быть >=2 войск).');
                    return;
                }
                if (terr.armies < 2) {
                    setStatus('Недостаточно войск для атаки (нужно минимум 2).');
                    return;
                }
                // Проверяем, есть ли вражеские соседи
                const enemies = getEnemyNeighbors(terr.id, game.currentPlayer);
                if (enemies.length === 0) {
                    setStatus('У этой территории нет вражеских соседей.');
                    return;
                }
                game.selectedFrom = terr.id;
                setStatus(`Выбран источник: ${terr.name}. Теперь выберите вражескую соседнюю территорию для атаки.`);
                drawMap();
                return;
            } else {
                // Уже выбран источник — пытаемся атаковать цель
                const source = getTerritory(game.selectedFrom);
                // Цель должна быть соседней, вражеской
                if (!source.neighbors.includes(terr.id)) {
                    setStatus('Выбранная территория не является соседней с источником.');
                    return;
                }
                if (terr.ownerId === game.currentPlayer) {
                    setStatus('Нельзя атаковать свою территорию.');
                    return;
                }
                if (terr.ownerId === null) {
                    setStatus('Эта территория нейтральна, её нельзя атаковать (должна быть захвачена ранее).');
                    return;
                }
                // Проведём битву
                const result = resolveBattle(source.id, terr.id);
                updatePlayerArmies();
                // Проверка на победу
                const winner = checkWin();
                if (winner) {
                    setStatus(`🏆 Игрок ${winner.name} победил! Захвачены все территории!`);
                    game.gameOver = true;
                    disableButtons(true);
                    drawMap();
                    updateUI();
                    return;
                }
                // Если захват удался, можно продолжить атаку с того же источника или выбрать новый
                if (result.conquered) {
                    setStatus(`Захват! ${terr.name} теперь ваш. Можете продолжить атаку (выберите источник) или завершить ход.`);
                    // Сбрасываем selectedFrom, чтобы можно было выбрать новый источник или продолжать с этого же
                    game.selectedFrom = null;
                    // Но также можно разрешить атаковать дальше с этой же территории — пользователь сам выберет.
                } else {
                    setStatus(`Битва завершена. Потери: атакующий ${result.aLoss}, защитник ${result.dLoss}. Выберите источник для атаки или завершите ход.`);
                    game.selectedFrom = null;
                }
                drawMap();
                updateUI();
                return;
            }
        }

        if (game.phase === 'move') {
            // Перемещение войск между своими территориями
            if (game.selectedFrom === null) {
                // Выбираем источник (своя территория с >1 войска)
                if (terr.ownerId !== game.currentPlayer) {
                    setStatus('Выберите свою территорию с более чем 1 войском для перемещения.');
                    return;
                }
                if (terr.armies <= 1) {
                    setStatus('Нужно минимум 2 войска, чтобы оставить 1 и переместить остальные.');
                    return;
                }
                // Проверяем, есть ли соседние свои территории
                const ownNeighbors = getControlledNeighbors(terr.id, game.currentPlayer);
                if (ownNeighbors.length === 0) {
                    setStatus('Нет соседних своих территорий для перемещения.');
                    return;
                }
                game.selectedFrom = terr.id;
                setStatus(`Выбран источник: ${terr.name}. Теперь выберите соседнюю свою территорию для перемещения.`);
                drawMap();
                return;
            } else {
                // Цель перемещения
                const source = getTerritory(game.selectedFrom);
                if (!source.neighbors.includes(terr.id)) {
                    setStatus('Цель не является соседней с источником.');
                    return;
                }
                if (terr.ownerId !== game.currentPlayer) {
                    setStatus('Можно перемещать только на свои территории.');
                    return;
                }
                if (source.armies <= 1) {
                    setStatus('В источнике недостаточно войск для перемещения (нужно >1).');
                    return;
                }
                // Перемещаем все, кроме одного (или сколько хочет игрок? Упростим: перемещаем все, кроме 1)
                const toMove = source.armies - 1;
                source.armies = 1;
                terr.armies += toMove;
                updatePlayerArmies();
                setStatus(`Перемещено ${toMove} войск с ${source.name} на ${terr.name}. Ход завершён. Нажмите "Завершить ход".`);
                game.selectedFrom = null;
                game.phase = 'move_done'; // чтобы не давать больше перемещать в этом ходу
                drawMap();
                updateUI();
                return;
            }
        }

        // Если фаза 'move_done' или другие — просто игнорируем
        if (game.phase === 'move_done') {
            setStatus('Перемещение уже выполнено. Завершите ход.');
        }
    }

    // ============================================================
    //  КОМПЬЮТЕРНЫЙ ИИ (упрощённый)
    // ============================================================
    function aiTurn() {
        if (game.gameOver) return;
        const player = getPlayer(1);
        // 1. Подкрепление
        const bonus = calculateReinforcements(1);
        player.armiesTotal += bonus;
        updatePlayerArmies();

        // Размещаем подкрепление на свои территории (равномерно)
        const own = getPlayerTerritories(1);
        if (own.length > 0 && player.armiesTotal > 0) {
            // Размещаем по одному на каждую, пока не кончатся
            let i = 0;
            while (player.armiesTotal > 0) {
                own[i % own.length].armies += 1;
                player.armiesTotal -= 1;
                i++;
            }
            updatePlayerArmies();
        }

        // 2. Атака: ищем территории с >=2 войсками и атакуем вражеских соседей
        let attacked = false;
        for (let t of own) {
            if (t.armies < 2) continue;
            const enemies = getEnemyNeighbors(t.id, 1);
            if (enemies.length === 0) continue;
            // Выбираем врага с наименьшим количеством войск
            enemies.sort((a, b) => a.armies - b.armies);
            const target = enemies[0];
            // Атакуем
            const result = resolveBattle(t.id, target.id);
            updatePlayerArmies();
            attacked = true;
            // Если захватили, можем продолжить с этой же территории (но для простоты прервём)
            if (result.conquered) {
                // Проверка победы
                const winner = checkWin();
                if (winner) {
                    setStatus(`🏆 Игрок ${winner.name} победил!`);
                    game.gameOver = true;
                    disableButtons(true);
                    drawMap();
                    updateUI();
                    return;
                }
                // Можно ещё атаковать, но упростим — после одного захвата перейдём к перемещению
                break;
            }
        }

        // 3. Перемещение: если есть территории с >1 войска, перемещаем на соседние свои с малым количеством
        for (let t of own) {
            if (t.armies > 1) {
                const ownNeighbors = getControlledNeighbors(t.id, 1);
                if (ownNeighbors.length === 0) continue;
                // Найдём соседа с наименьшим количеством войск
                ownNeighbors.sort((a, b) => a.armies - b.armies);
                const target = ownNeighbors[0];
                const toMove = t.armies - 1;
                t.armies = 1;
                target.armies += toMove;
                updatePlayerArmies();
                break; // только одно перемещение
            }
        }

        // Завершаем ход компьютера
        setStatus('Компьютер завершил ход.');
        // Передаём ход человеку
        game.currentPlayer = 0;
        startTurn(0);
    }

    // ============================================================
    //  ОТРИСОВКА КАРТЫ
    // ============================================================
    function drawMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Рисуем связи
        ctx.strokeStyle = '#5d6d7e';
        ctx.lineWidth = 2;
        for (let t of game.territories) {
            for (let nId of t.neighbors) {
                const n = getTerritory(nId);
                ctx.beginPath();
                ctx.moveTo(t.x, t.y);
                ctx.lineTo(n.x, n.y);
                ctx.stroke();
            }
        }

        // Рисуем территории
        for (let t of game.territories) {
            const isSelected = (game.selectedFrom === t.id);
            const isHighlight = (game.phase === 'attack' && game.selectedFrom !== null && 
                                 getTerritory(game.selectedFrom).neighbors.includes(t.id) && t.ownerId !== game.currentPlayer);

            let color = '#34495e'; // нейтральная
            if (t.ownerId !== null) {
                color = getPlayer(t.ownerId).color;
            }

            // Радиус
            const r = 30;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8;
            // Круг
            ctx.beginPath();
            ctx.arc(t.x, t.y, r, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = isSelected ? '#f1c40f' : (isHighlight ? '#e67e22' : '#2c3e50');
            ctx.lineWidth = isSelected ? 4 : 2;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Название и количество войск
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.name, t.x, t.y - 20);
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`💂 ${t.armies}`, t.x, t.y + 6);
            if (t.ownerId !== null) {
                ctx.font = '12px Arial';
                ctx.fillText(getPlayer(t.ownerId).name, t.x, t.y + 28);
            }
        }

        // Если игра окончена, наложим затемнение и надпись
        if (game.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const winner = checkWin();
            if (winner) {
                ctx.fillText(`🏆 ${winner.name} победил!`, canvas.width/2, canvas.height/2);
            } else {
                ctx.fillText('Игра окончена', canvas.width/2, canvas.height/2);
            }
        }
    }

    // ============================================================
    //  ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
        const current = getPlayer(game.currentPlayer);
        document.getElementById('currentPlayerTag').textContent = current ? current.name : '—';
        document.getElementById('currentPlayerTag').style.background = current ? current.color : '#999';
        const totalArmies = current ? current.armiesTotal : 0;
        document.getElementById('armyCount').textContent = `💂 ${totalArmies}`;
        // Кнопка завершения хода
        const btn = document.getElementById('endTurnBtn');
        if (game.gameOver || game.currentPlayer === 1) {
            btn.disabled = true;
        } else {
            btn.disabled = false;
        }
    }

    function setStatus(msg) {
        document.getElementById('statusMessage').textContent = msg;
    }

    function disableButtons(disabled) {
        document.getElementById('endTurnBtn').disabled = disabled;
    }

    // ============================================================
    //  ОБРАБОТКА КЛИКОВ НА CANVAS
    // ============================================================
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        // Проверяем попадание в круг территории
        for (let t of game.territories) {
            const dx = mouseX - t.x;
            const dy = mouseY - t.y;
            if (dx*dx + dy*dy <= 30*30) {
                handleTerritoryClick(t.id);
                break;
            }
        }
    });

    // ============================================================
    //  КНОПКА ЗАВЕРШИТЬ ХОД
    // ============================================================
    document.getElementById('endTurnBtn').addEventListener('click', () => {
        if (game.gameOver) return;
        if (game.currentPlayer !== 0) return; // только человек

        // Если мы в фазе reinforce, но у человека остались войска — запрещаем завершать?
        if (game.phase === 'reinforce' && getPlayer(0).armiesTotal > 0) {
            setStatus('У вас остались неразмещённые войска! Разместите их перед завершением хода.');
            return;
        }

        // Если в фазе attack или move или move_done — можно завершать
        // Передаём ход компьютеру
        game.currentPlayer = 1;
        // Сбрасываем выбор
        game.selectedFrom = null;
        game.selectedTo = null;
        startTurn(1);
    });

    // ============================================================
    //  НОВАЯ ИГРА
    // ============================================================
    document.getElementById('resetBtn').addEventListener('click', () => {
        if (game.aiTimeout) clearTimeout(game.aiTimeout);
        initGame();
    });

    // ============================================================
    //  ЗАПУСК
    // ============================================================
    initGame();
</script>
</body>
